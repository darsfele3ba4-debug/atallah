<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>أنواع الفعل المعتل | القائد في اللغة العربية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1e3a8a; --deep:#0f1f4d; --night:#070d22; --gold:#f2c14e; --gold2:#e0a526; --danger:#ef4444; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Cairo', Tahoma, sans-serif; -webkit-tap-highlight-color:transparent; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; color:#fff;
         background:radial-gradient(circle at 80% 8%, rgba(242,193,78,.22), transparent 45%), linear-gradient(150deg, var(--night), var(--deep) 50%, var(--navy)); }
  .card { width:100%; max-width:430px; text-align:center; background:rgba(255,255,255,.06); border:1px solid rgba(242,193,78,.35);
          border-radius:28px; padding:30px 22px 26px; box-shadow:0 25px 50px -12px rgba(0,0,0,.55); backdrop-filter:blur(6px); }
  .photo { width:130px; aspect-ratio:3/4; object-fit:cover; object-position:center top; border-radius:22px; border:3px solid var(--gold);
           box-shadow:0 0 0 5px rgba(242,193,78,.16), 0 10px 22px rgba(0,0,0,.45); }
  .brand { margin-top:14px; font-size:1.7rem; font-weight:900; line-height:1.3; background:linear-gradient(to bottom,#fff1b8,#f2c14e 55%,#c98a12);
           -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .teacher { color:#fff3cf; font-weight:700; margin-top:2px; }
  .lesson { margin:18px 0 4px; font-size:1.25rem; font-weight:800; }
  .grade { color:#cbd5e1; font-size:.95rem; font-weight:600; }
  .lock { display:inline-flex; align-items:center; gap:8px; margin:20px 0 10px; color:#fde68a; font-weight:700; }
  input { width:100%; padding:14px; border-radius:14px; border:2px solid rgba(242,193,78,.5); background:#fff; color:#0f172a;
          font-size:1.5rem; font-weight:900; letter-spacing:6px; text-align:center; direction:ltr; text-transform:uppercase; outline:none; }
  input:focus { border-color:var(--gold); box-shadow:0 0 0 4px rgba(242,193,78,.25); }
  button { width:100%; margin-top:12px; padding:13px; border:none; border-radius:14px; cursor:pointer; font-size:1.15rem; font-weight:800;
           background:linear-gradient(to bottom,#f6d27a,var(--gold2)); color:var(--night); border-bottom:3px solid rgba(0,0,0,.25); }
  button:disabled { opacity:.7; cursor:wait; }
  .msg { min-height:26px; margin-top:10px; font-weight:700; color:#fca5a5; }
  .shake { animation:shake .45s; }
  @keyframes shake { 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }
  .help { display:inline-block; margin-top:6px; color:#86efac; font-weight:700; text-decoration:none; font-size:.95rem; }
  .err { color:#fca5a5; font-weight:700; margin-top:14px; display:none; }
</style>

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function norm(c) { return (c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  async function decrypt(code) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' },
                                            base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(DATA));
    return new TextDecoder().decode(buf);
  }
  function open(html) { document.open(); document.write(html); document.close(); }

  var f = document.getElementById('f'), inp = document.getElementById('code'),
      btn = document.getElementById('go'), msg = document.getElementById('msg');

  if (!window.crypto || !crypto.subtle) {
    document.getElementById('nocrypto').style.display = 'block'; btn.disabled = true; return;
  }

  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    var code = norm(inp.value);
    if (!code) { msg.textContent = 'اكتب الكود الأول ✋'; inp.focus(); return; }
    btn.disabled = true; btn.textContent = 'جارٍ التحقق...'; msg.textContent = '';
    try {
      var html = await decrypt(code);
      store(KEY, code);
      open(html);
    } catch (err) {
      btn.disabled = false; btn.textContent = 'فتح الدرس';
      msg.textContent = 'الكود غير صحيح ❌ حاول مرة تانية';
      inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
      inp.select();
    }
  });

  // فتح تلقائي لو الطالب أدخل الكود قبل كده على نفس الجهاز
  var saved = load(KEY);
  if (saved) {
    btn.disabled = true; btn.textContent = 'جارٍ الفتح...';
    decrypt(saved).then(open, function () { store(KEY, null); btn.disabled = false; btn.textContent = 'فتح الدرس'; });
  } else { inp.focus(); }
})();
